<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Movie Storage</title>
    <link rel='stylesheet' href='{{ url_for('static', filename='home.css' ) }}'>
    <link rel='stylesheet' href='{{ url_for('static', filename='base.css' ) }}'>
</head>

<body>
    <nav class="navbar">
        <div><a href="/">Home</a></div>
        <div><a href="/saved">Saved</a></div>
    </nav>
    <h1>Movie Catalog</h1>
    <form method='GET' action='/' id="search-form">
        <input type='text' name='search' placeholder='Movie Title' value='{{ searchQuery }}' required>
        <button type='submit'>Search</button>
    </form>
    <div class="spacer"></div>
    <form action="/" method="POST" id="submit-form" autoComplete="off">
        <button type="submit">Add Selected Movies</button>
        <div class="spacer"></div>
        {% for item in items %}
        <label class="media-option">
            <input type="checkbox" name="selected_movies" value="" id={{item.id}}>
            <img src="{{ item.photo_url[0] }}" alt="{{ item.title }} poster" class="media-poster">
            <span class="media-info">
                <span class="media-title">{{ item.title }}</span>
                <span class="media-year">Year: {{ item.year }}</span>
                <span class="media-type">Media: {{ item.type }}</span>
            </span>

        </label>
        {% endfor %}
    </form>
</body>
<script>
    var items = {{ items| tojson }};
    document.getElementById("submit-form").addEventListener("submit", async function (e) {
        // Prevent moving from page
        e.preventDefault();
        // Get all selected movies
        const selectedMovies = Array.from(document.querySelectorAll('input[name="selected_movies"]:checked')).map(input => input.id);
        const selectedMoviesFull = items.filter(
            movie => selectedMovies.includes(String(movie.id))
        );
        console.log(selectedMoviesFull);
        // Send movies to the media-catalog API
    });
</script>

</html>
