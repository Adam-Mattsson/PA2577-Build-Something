apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-catalog-deployment
  labels:
    app: media-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-catalog
  template:
    metadata:
      labels:
        app: media-catalog
    spec:
      containers:
        - name: media-catalog
          image: media-catalog:latest
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              value: media-db-service
            - name: DB_NAME
              value: media-db
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

---
apiVersion: v1
kind: Service
metadata:
  name: media-catalog-service
spec:
  selector:
    app: media-catalog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
