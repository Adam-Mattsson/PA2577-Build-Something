apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-catalog-deployment
  labels:
    app: media-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-catalog
  template:
    metadata:
      labels:
        app: media-catalog
    spec:
      containers:
        - name: media-catalog
          image: media-catalog:latest
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: media-catalog-service
spec:
  selector:
    app: media-catalog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
