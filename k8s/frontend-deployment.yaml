apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: media-frontend
          image: adammattsson/media-frontend:latest
          ports:
            - containerPort: 5000
          env:
            - name: MEDIA_CATALOG_SERVICE_URL
              value: "http://media-catalog-service"
            - name: SERVICE_RECOMMENDATION_SERVICE_URL
              value: "http://service-recommendation"
            - name: PORT
              value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
